name: Deploy

on:
  push:
    branches:
      - develop
      - master

jobs:
  deploy-uat-api:
    name: Deploy UAT API (develop)
    if: github.ref == 'refs/heads/develop'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy API and restart PM2 (UAT)
        run: |
          rsync -a --delete --exclude node_modules --exclude .env nurse-api/ /home/ubuntu/nurse-api-uat/
          cd /home/ubuntu/nurse-api-uat
          npm install --production
          PGPASSWORD="${{ secrets.DB_PASSWORD_UAT }}" psql -h 10.1.2.182 -U nurseapp_uat -d nurse_rota_uat -c \
            "CREATE TABLE IF NOT EXISTS schema_migrations (name TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT NOW());"
          for f in $(ls migrations/*.sql 2>/dev/null | sort); do
            name=$(basename "$f")
            applied=$(PGPASSWORD="${{ secrets.DB_PASSWORD_UAT }}" psql -h 10.1.2.182 -U nurseapp_uat -d nurse_rota_uat -tAc \
              "SELECT COUNT(*) FROM schema_migrations WHERE name='$name';")
            if [ "$applied" = "0" ]; then
              echo "Applying migration: $name"
              # ON_ERROR_STOP: psql stops at the first failing statement instead of
              # printing the error and plowing on to the rest of the file.
              # --single-transaction: wraps the whole file in BEGIN/COMMIT, so a
              # failure rolls back everything the file did — no partially-applied
              # schema left behind. Combined with the exit-code check below, a
              # failed migration can no longer get silently marked as applied.
              if ! PGPASSWORD="${{ secrets.DB_PASSWORD_UAT }}" psql -h 10.1.2.182 -U nurseapp_uat -d nurse_rota_uat \
                  -v ON_ERROR_STOP=1 --single-transaction -f "$f"; then
                echo "::error::Migration $name FAILED on UAT — deploy stopped before restarting the API. It was rolled back (single-transaction), so the DB is unchanged. Fix the migration and push again."
                exit 1
              fi
              PGPASSWORD="${{ secrets.DB_PASSWORD_UAT }}" psql -h 10.1.2.182 -U nurseapp_uat -d nurse_rota_uat -c \
                "INSERT INTO schema_migrations (name) VALUES ('$name');"
            else
              echo "Skipping already-applied migration: $name"
            fi
          done
          MARKER="=== deploy $(date -u +"%Y-%m-%dT%H:%M:%SZ") commit ${{ github.sha }} ==="
          mkdir -p /home/ubuntu/.pm2/logs
          # Fork mode (this app) writes one unsuffixed log file, but glob both
          # patterns anyway so this keeps working unchanged if that ever changes.
          for f in /home/ubuntu/.pm2/logs/nurse-api-uat-out.log /home/ubuntu/.pm2/logs/nurse-api-uat-out-*.log \
                   /home/ubuntu/.pm2/logs/nurse-api-uat-error.log /home/ubuntu/.pm2/logs/nurse-api-uat-error-*.log; do
            [ -f "$f" ] && echo "$MARKER" >> "$f"
          done
          pm2 reload nurse-api-uat || pm2 start server.js --name nurse-api-uat --cwd /home/ubuntu/nurse-api-uat
          pm2 save

      - name: Health check (UAT)
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3002/api/health > /dev/null; then
              echo "UAT API is up."
              exit 0
            fi
            echo "Attempt $i: not up yet, retrying in 2s..."
            sleep 2
          done
          echo "::error::UAT API did not respond on /api/health after deploy — check pm2 logs nurse-api-uat"
          exit 1

  build-frontend:
    name: Build frontend (master)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app (Production)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  deploy-production:
    name: Deploy Production (master)
    if: github.ref == 'refs/heads/master'
    needs: build-frontend
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy frontend (Production)
        run: rsync -a --delete dist/ /home/ubuntu/public_html/

      - name: Deploy API and restart PM2 (Production)
        run: |
          rsync -a --delete --exclude node_modules --exclude .env nurse-api/ /home/ubuntu/nurse-api/
          cd /home/ubuntu/nurse-api
          npm install --production
          PGPASSWORD="${{ secrets.DB_PASSWORD }}" psql -h 10.1.2.182 -U nurseapp -d nurse_rota -c \
            "CREATE TABLE IF NOT EXISTS schema_migrations (name TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT NOW());"
          for f in $(ls migrations/*.sql 2>/dev/null | sort); do
            name=$(basename "$f")
            applied=$(PGPASSWORD="${{ secrets.DB_PASSWORD }}" psql -h 10.1.2.182 -U nurseapp -d nurse_rota -tAc \
              "SELECT COUNT(*) FROM schema_migrations WHERE name='$name';")
            if [ "$applied" = "0" ]; then
              echo "Applying migration: $name"
              # ON_ERROR_STOP: psql stops at the first failing statement instead of
              # printing the error and plowing on to the rest of the file.
              # --single-transaction: wraps the whole file in BEGIN/COMMIT, so a
              # failure rolls back everything the file did — no partially-applied
              # schema left behind. Combined with the exit-code check below, a
              # failed migration can no longer get silently marked as applied.
              if ! PGPASSWORD="${{ secrets.DB_PASSWORD }}" psql -h 10.1.2.182 -U nurseapp -d nurse_rota \
                  -v ON_ERROR_STOP=1 --single-transaction -f "$f"; then
                echo "::error::Migration $name FAILED on Production — deploy stopped before restarting the API. It was rolled back (single-transaction), so the DB is unchanged. Fix the migration and push again."
                exit 1
              fi
              PGPASSWORD="${{ secrets.DB_PASSWORD }}" psql -h 10.1.2.182 -U nurseapp -d nurse_rota -c \
                "INSERT INTO schema_migrations (name) VALUES ('$name');"
            else
              echo "Skipping already-applied migration: $name"
            fi
          done
          MARKER="=== deploy $(date -u +"%Y-%m-%dT%H:%M:%SZ") commit ${{ github.sha }} ==="
          mkdir -p /home/ubuntu/.pm2/logs
          # Cluster mode (this app, 4 workers) gives each worker its own numbered
          # log file (nurse-api-out-<pm_id>.log) instead of one shared file — glob
          # both the plain and numbered patterns so the marker reaches whichever
          # ones actually exist, however many workers are currently running.
          for f in /home/ubuntu/.pm2/logs/nurse-api-out.log /home/ubuntu/.pm2/logs/nurse-api-out-*.log \
                   /home/ubuntu/.pm2/logs/nurse-api-error.log /home/ubuntu/.pm2/logs/nurse-api-error-*.log; do
            [ -f "$f" ] && echo "$MARKER" >> "$f"
          done
          pm2 reload nurse-api || pm2 start server.js --name nurse-api --cwd /home/ubuntu/nurse-api -i 4
          pm2 save

      - name: Health check (Production)
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "Production API is up."
              exit 0
            fi
            echo "Attempt $i: not up yet, retrying in 2s..."
            sleep 2
          done
          echo "::error::Production API did not respond on /api/health after deploy — check pm2 logs nurse-api"
          exit 1
